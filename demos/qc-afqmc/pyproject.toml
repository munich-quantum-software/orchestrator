[project]
name = "qc-afqmc"
version = "0.1.0"
description = "Quantum-assisted auxiliary-field quantum Monte Carlo on MQSC Orchestrator"
license = "Apache-2.0 WITH LLVM-exception"
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "matplotlib>=3.11.2",
  "mpi4py>=4.1.2",
  "mqt-core[pennylane,qiskit]>=4.2.1",
  "numba>=0.68",
  "numpy>=2.5.4",
  "openfermion>=1.8.1",
  "pyscf>=2.14",
  "scipy>=1.18.1",
]

[tool.uv]
package = false
