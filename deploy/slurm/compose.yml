# CI prebuilds the image with a persistent layer cache and names it here.
x-cluster: &cluster
  image: ${MQSC_ORCHESTRATOR_IMAGE:-${COMPOSE_PROJECT_NAME:-slurm}-controller}
  pull_policy: never
  privileged: true
  cgroup: host
  tmpfs:
    - /run
    - /run/lock
  volumes:
    - ${MQSC_ORCHESTRATOR_ROOT:-../..}:/workspace:ro
    - ${MQSC_ORCHESTRATOR_RUNTIME:-../../build/slurm}/munge.key:/runtime/munge.key:ro
    - ${MQSC_ORCHESTRATOR_RUNTIME:-../../build/slurm}/jobs:/jobs
    - ${MQSC_ORCHESTRATOR_RUNTIME:-../../build/slurm}/resources.yaml:/etc/slurm/resources.yaml:ro
    - ${MQSC_ORCHESTRATOR_RUNTIME:-../../build/slurm}/slurm.conf:/etc/slurm/slurm.conf:ro
    - ${MQSC_ORCHESTRATOR_RUNTIME:-../../build/slurm}/qdmi.json:/etc/mqt-core/qdmi.json:ro
    - ./cgroup.conf:/etc/slurm/cgroup.conf:ro
  networks:
    - cluster

x-healthcheck: &healthcheck
  interval: 2s
  timeout: 2s
  retries: 60
  start_period: 5s

x-compute: &compute
  <<: *cluster
  depends_on:
    controller:
      condition: service_started
  healthcheck:
    <<: *healthcheck
    test:
      [
        CMD-SHELL,
        "systemctl is-active --quiet munge.service && systemctl is-active --quiet slurmd.service",
      ]

x-qan: &qan
  <<: *compute
  command: [/usr/local/sbin/mqt-slurm-start, qan]
  networks:
    - cluster
    - egress

services:
  database:
    image: mariadb:13.0
    environment:
      MARIADB_DATABASE: slurm_acct_db
      MARIADB_USER: slurm
      MARIADB_PASSWORD_FILE: /run/secrets/accounting_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - accounting_password
      - database_password
    command:
      - --innodb-buffer-pool-size=128M
      - --innodb-log-file-size=64M
      - --innodb-lock-wait-timeout=900
      - --innodb-snapshot-isolation=OFF
      - --max-allowed-packet=16M
    volumes:
      - accounting-data:/var/lib/mysql
    networks:
      - cluster
    healthcheck:
      <<: *healthcheck
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]

  accounting:
    <<: *cluster
    hostname: accounting
    command: [/usr/local/sbin/mqt-slurm-start, accounting]
    secrets:
      - accounting_password
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test:
        [
          CMD-SHELL,
          "systemctl is-active --quiet slurmdbd.service && systemctl is-active --quiet slurm-accounting.service",
        ]

  controller:
    <<: *cluster
    build:
      context: .
      additional_contexts:
        orchestrator: ${MQSC_ORCHESTRATOR_ROOT:-../..}
      args:
        BUILDKIT_SYNTAX: docker/dockerfile:1.19
    hostname: controller
    command: [/usr/local/sbin/mqt-slurm-start, controller]
    volumes:
      - ${MQSC_ORCHESTRATOR_ROOT:-../..}:/workspace:ro
      - ${MQSC_ORCHESTRATOR_RUNTIME:-../../build/slurm}/munge.key:/runtime/munge.key:ro
      - ${MQSC_ORCHESTRATOR_RUNTIME:-../../build/slurm}/jobs:/jobs
      - ${MQSC_ORCHESTRATOR_RUNTIME:-../../build/slurm}/resources.yaml:/etc/slurm/resources.yaml:ro
      - ${MQSC_ORCHESTRATOR_RUNTIME:-../../build/slurm}/slurm.conf:/etc/slurm/slurm.conf:ro
      - ${MQSC_ORCHESTRATOR_RUNTIME:-../../build/slurm}/qdmi.json:/etc/mqt-core/qdmi.json:ro
      - ${MQSC_ORCHESTRATOR_RUNTIME:-../../build/slurm}/qdmi.env:/runtime/qdmi.env:ro
      - ./cgroup.conf:/etc/slurm/cgroup.conf:ro
      - controller-state:/var/spool/slurmctld
    networks:
      cluster:
        aliases: [controller-cluster]
      egress:
    depends_on:
      accounting:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test:
        [
          CMD-SHELL,
          "systemctl is-active --quiet munge.service && systemctl is-active --quiet slurmctld.service",
        ]

  login:
    <<: *cluster
    hostname: login
    command: [/usr/local/sbin/mqt-slurm-start, login]
    working_dir: /jobs
    networks:
      - cluster
      - egress
    depends_on:
      controller:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: [CMD, systemctl, is-active, --quiet, munge.service]

  node:
    <<: *compute
    scale: 2
    command: [/usr/local/sbin/mqt-slurm-start, node]

  qan1:
    <<: *qan
    hostname: qan1

  qan2:
    <<: *qan
    hostname: qan2

networks:
  cluster:
    internal: true
  egress:

volumes:
  accounting-data:
  controller-state:

secrets:
  accounting_password:
    file: ${MQSC_ORCHESTRATOR_RUNTIME:-../../build/slurm}/accounting-password
  database_password:
    file: ${MQSC_ORCHESTRATOR_RUNTIME:-../../build/slurm}/database-password
