# Both QANs can access each device; counts limit concurrent allocations.
# Provider devices stay closed until qdmi.json enables them and credentials exist.
# Remote checks call provider APIs, so they run every three minutes; local ones every 30 s.
- resource: mqt.ddsim.default
  mode: MODE_1
  plugin:
    type: hres/lua
    config:
      - name: path
        value: /etc/slurm/hres_qdmi.lua
    maintenance_cycle: 30
    maintenance_timeout: 15
  layers:
    - layer_name: quantum
      nodes: ["qan[1-2]"]
      count: 2
