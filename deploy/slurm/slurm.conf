ClusterName=mqsc-orchestrator
SlurmctldHost=controller(controller-cluster)
SlurmUser=slurm
AuthType=auth/munge
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/run/slurmctld/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid

AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=accounting
AccountingStorageEnforce=associations
AccountingStorageTRES=license/mqt.ddsim.default,license/mqt.sc.default,license/iqm.emerald,license/iqm.garnet,license/iqm.sirius,license/ibm.aachen,license/ibm.berlin,license/amazon.braket.aqt.ibex-q1,license/amazon.braket.ionq.forte-1,license/amazon.braket.iqm.emerald,license/amazon.braket.iqm.garnet,license/amazon.braket.rigetti.cepheus-1-108q,license/amazon.braket.sv1,license/pasqal.emu-free

ProctrackType=proctrack/cgroup
TaskPlugin=task/cgroup,task/affinity
JobAcctGatherType=jobacct_gather/cgroup
SelectType=select/cons_tres
SelectTypeParameters=CR_CPU_Memory
DefMemPerCPU=1024
PrologFlags=Contain

SchedulerType=sched/backfill
ReturnToService=2
SlurmdParameters=config_overrides
SlurmctldParameters=reconfig_on_restart

MaxNodeCount=128
NodeName=qan[1-2] CPUs=4 Boards=1 SocketsPerBoard=1 CoresPerSocket=4 ThreadsPerCore=1 RealMemory=8192 Feature=quantum
NodeSet=classical Feature=classical
PartitionName=DEFAULT MaxTime=INFINITE State=UP
PartitionName=compute Nodes=classical Default=YES
PartitionName=quantum Nodes=qan[1-2]
