name: Release Drafter

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  update_release_draft:
    if: github.event.repository.private == false
    name: Run
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
