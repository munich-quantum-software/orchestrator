name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host-and-docs:
    if: github.event.repository.private == false
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
      - run: uvx nox -s lint tests docs
  slurm:
    if: github.event.repository.private == false
    runs-on: ubuntu-26.04
    # A cold image build compiles Slurm, Core, and the providers from source.
    timeout-minutes: 180
    env:
      MQSC_ORCHESTRATOR_IMAGE: mqsc-orchestrator:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the cluster image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/slurm
          build-contexts: orchestrator=.
          tags: ${{ env.MQSC_ORCHESTRATOR_IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Run the Slurm, DDSIM, format, and QC-AFQMC checks
        run: uv run --script tests/slurm/run_integration.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: integration-jobs
          path: build/slurm-tests/*/jobs
